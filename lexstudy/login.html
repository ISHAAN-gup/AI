<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLAT 2027 Prep Hub - Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <h1><i class="fa-solid fa-graduation-cap"></i> CLAT 2027 Prep Hub</h1>
      <p>Your focused study app for legal reasoning, current affairs, English, logic, and QT.</p>
      <div class="auth-tabs">
        <button id="tabLogin" class="active">Login</button>
        <button id="tabSignup" class="btn-secondary">Signup</button>
      </div>
      <form id="loginForm">
        <input name="email" type="email" placeholder="Email" required />
        <input name="password" type="password" placeholder="Password" minlength="6" required />
        <button type="submit">Login</button>
      </form>
      <form id="signupForm" class="hidden">
        <input name="name" placeholder="Full name" required />
        <input name="email" type="email" placeholder="Email" required />
        <input name="password" type="password" placeholder="Password" minlength="6" required />
        <button type="submit">Create account</button>
      </form>
    </div>
  </div>
  <div id="toasts" class="toast-wrap"></div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
